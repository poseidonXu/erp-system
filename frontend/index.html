<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>华晟 ERP 管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="login-page" class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">HS</div>
      <h1>华晟 ERP 管理系统</h1>
      <p>机械制造 · 一体化业务管理平台</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="login-user" value="admin" autocomplete="username" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-pwd" value="123456" autocomplete="current-password" placeholder="请输入密码">
      </div>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <div class="login-hint">演示账号：admin / 123456（其他角色密码同为 123456）</div>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="app hidden">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark small">HS</div>
      <div><strong>华晟 ERP</strong><small>Huasheng ERP</small></div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="sidebar-footer">Powered by HighGo + Flask</div>
  </aside>

  <!-- 主区域 -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="toggle-sidebar" title="收起/展开菜单">☰</button>
        <span id="page-title" class="page-title">经营概览</span>
      </div>
      <div class="topbar-right">
        <span class="db-status"><span class="dot"></span> HighGo 已连接</span>
        <span id="current-user" class="user-chip">管理员</span>
        <button class="btn btn-ghost btn-sm" id="logout">退出</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- 模态框 -->
<div id="modal" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 id="modal-title">编辑</h3>
      <button class="icon-btn" data-close>&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close>取消</button>
      <button class="btn btn-primary" id="modal-ok">确定</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
